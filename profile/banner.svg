<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" fill="none" role="img" aria-label="funnest — 투자의 모든 순간을, 더 재밌게">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14121F"/>
      <stop offset="1" stop-color="#1B1730"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 150) rotate(90) scale(260 420)">
      <stop stop-color="#6C4DFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6C4DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B6CFF"/>
      <stop offset="1" stop-color="#5A3BF0"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="90" x2="0" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B6CFF" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8B6CFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glow)"/>

  <!-- Candles (red up, blue down — the Korean way) under a rising line that ends in the yellow peak. -->
  <g transform="translate(700 0)">
    <g stroke-width="2">
      <line x1="30" y1="250" x2="30" y2="300" stroke="#3182F6"/><rect x="24" y="262" width="12" height="28" rx="2" fill="#3182F6"/>
      <line x1="66" y1="236" x2="66" y2="292" stroke="#F04452"/><rect x="60" y="248" width="12" height="34" rx="2" fill="#F04452"/>
      <line x1="102" y1="230" x2="102" y2="276" stroke="#F04452"/><rect x="96" y="238" width="12" height="28" rx="2" fill="#F04452"/>
      <line x1="138" y1="238" x2="138" y2="284" stroke="#3182F6"/><rect x="132" y="246" width="12" height="26" rx="2" fill="#3182F6"/>
      <line x1="174" y1="214" x2="174" y2="270" stroke="#F04452"/><rect x="168" y="222" width="12" height="38" rx="2" fill="#F04452"/>
      <line x1="210" y1="196" x2="210" y2="246" stroke="#F04452"/><rect x="204" y="204" width="12" height="30" rx="2" fill="#F04452"/>
      <line x1="246" y1="202" x2="246" y2="250" stroke="#3182F6"/><rect x="240" y="212" width="12" height="24" rx="2" fill="#3182F6"/>
      <line x1="282" y1="176" x2="282" y2="232" stroke="#F04452"/><rect x="276" y="184" width="12" height="40" rx="2" fill="#F04452"/>
      <line x1="318" y1="160" x2="318" y2="210" stroke="#F04452"/><rect x="312" y="168" width="12" height="32" rx="2" fill="#F04452"/>
      <line x1="354" y1="166" x2="354" y2="214" stroke="#3182F6"/><rect x="348" y="176" width="12" height="26" rx="2" fill="#3182F6"/>
      <line x1="390" y1="138" x2="390" y2="196" stroke="#F04452"/><rect x="384" y="146" width="12" height="40" rx="2" fill="#F04452"/>
      <line x1="426" y1="116" x2="426" y2="170" stroke="#F04452"/><rect x="420" y="124" width="12" height="36" rx="2" fill="#F04452"/>
      <line x1="462" y1="96" x2="462" y2="148" stroke="#F04452"/><rect x="456" y="104" width="12" height="34" rx="2" fill="#F04452"/>
    </g>
    <path d="M10 300 C 90 290, 120 250, 180 246 S 300 200, 340 186 S 430 120, 500 84 L 500 330 L 10 330 Z" fill="url(#area)"/>
    <path d="M10 300 C 90 290, 120 250, 180 246 S 300 200, 340 186 S 430 120, 500 84" stroke="#A48BFF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="510" cy="78" r="12" fill="#FFD43B"/>
    <circle cx="510" cy="78" r="22" fill="#FFD43B" fill-opacity="0.18"/>
  </g>

  <!-- Mark + wordmark -->
  <g transform="translate(96 104)">
    <svg width="64" height="64" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="9" fill="url(#mark)"/>
      <path d="M7 13.5C9.5 21.5 17 23.5 23.4 11.2" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
      <circle cx="24.6" cy="8.6" r="2.9" fill="#FFD43B"/>
    </svg>
    <text x="84" y="48" fill="#FFFFFF" font-family="Inter, 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Segoe UI', sans-serif" font-size="46" font-weight="800" letter-spacing="-1.5">funnest</text>
  </g>

  <text x="96" y="248" fill="#FFFFFF" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="44" font-weight="800" letter-spacing="-1.2">투자의 모든 순간을, 더 재밌게</text>
  <text x="96" y="296" fill="#B9B4CC" font-family="'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif" font-size="22" font-weight="500" letter-spacing="-0.3">차트 · 모의투자 · 커뮤니티를 하나의 둥지에서</text>
  <text x="96" y="338" fill="#7C7794" font-family="Inter, 'Segoe UI', sans-serif" font-size="18" font-weight="500">funnest.xyz   ·   charts.funnest.xyz</text>
</svg>
